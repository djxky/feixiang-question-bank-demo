<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="本校老师共建的题单、单题与班级错题" />
    <title>本校题库 · 飞象 AI 题库</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" />
    <link rel="stylesheet" href="./school.css" />
  </head>
  <body>
    <header class="school-topbar">
      <div class="school-shell topbar-inner">
        <a class="back-home" href="./index.html"><i class="ri-arrow-left-line"></i>返回题单广场</a>
        <div class="school-identity"><i class="ri-school-line"></i><span>启航实验学校</span><em>七年级数学</em></div>
      </div>
    </header>

    <main class="school-shell school-main">
      <header class="school-heading">
        <div>
          <p>校内共享空间</p>
          <h1>本校题库</h1>
          <span>查看本校老师共建的题单，以及各班真实教学中沉淀的错题。</span>
        </div>
        <div class="school-stats" aria-label="本校题库资源概览">
          <span><strong>68</strong><small>份题单</small></span>
          <span><strong>2,436</strong><small>道题目</small></span>
          <span><strong>4</strong><small>个班级</small></span>
        </div>
      </header>

      <section class="library-panel">
        <header class="library-toolbar">
          <nav class="library-tabs" role="tablist" aria-label="本校题库内容类型">
            <button class="active" data-view="list" role="tab" aria-selected="true">
              <b>题单资源</b><span>整份练习与测评</span>
            </button>
            <button data-view="question" role="tab" aria-selected="false">
              <b>题库</b><span>单题与班级错题</span>
            </button>
          </nav>
          <label class="class-filter">
            <i class="ri-filter-3-line"></i>
            <select id="classFilter" aria-label="筛选班级">
              <option value="all">全部班级</option>
              <option value="七（1）班">七（1）班</option>
              <option value="七（2）班">七（2）班</option>
              <option value="七（3）班">七（3）班</option>
            </select>
            <i class="ri-arrow-down-s-line"></i>
          </label>
        </header>

        <div id="schoolResources" class="school-resource-grid"></div>
        <div id="schoolEmpty" class="school-empty" hidden>当前班级还没有这类资源</div>
      </section>
    </main>

    <div id="schoolToast" class="school-toast" role="status" aria-live="polite"></div>
    <script type="module" src="./school.js"></script>
  </body>
</html>
